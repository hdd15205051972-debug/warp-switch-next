name: Build macOS app

# Every push is compiled and self-tested on a real Mac.
# When main carries a version (build.sh Info.plist) that has no Release yet,
# a Release v<version> with the zip is published automatically.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS arm64 runners are often capacity-limited; build.sh cross-compiles both
    # architectures, so the Intel runner produces the same universal app.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app (runs --self-test at the end)
        run: bash build.sh

      - name: Package zip
        run: |
          APP="build/WARP 新开关.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          ZIP="build/WARP-Switch-Next-$VERSION-macOS-universal.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: WARP-Switch-Next-macOS
          path: ${{ env.ZIP }}

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
            --title "WARP 新开关 $VERSION" \
            --notes "修复合盖睡眠后连接自动断开的问题：唤醒后会等待网络恢复，并自动重新建立连接；隧道长时间无法自行恢复时也会先自动重建，重建失败才恢复系统代理并提示重试。"
