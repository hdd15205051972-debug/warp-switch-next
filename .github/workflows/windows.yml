name: Build Windows app

# Builds the Windows version on a real Windows machine and tests it:
# unit checks, setting and restoring the system proxy, screenshots of the window,
# and a real WARP connection (register, connect in both modes, browse through the system proxy).
# On main, a version (build.ps1) that has no Release yet is published once every test has passed.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.ps1

      - name: Unit self-test
        run: |
          $exe = Resolve-Path 'dist/WARP 新开关/WARP 新开关.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', '--out', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode

      - name: System proxy test
        run: |
          $exe = Resolve-Path 'dist/WARP 新开关/WARP 新开关.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--proxy-test', '--out', "$PWD\proxytest.txt" -Wait -PassThru
          Get-Content proxytest.txt
          exit $p.ExitCode

      - name: Screenshots
        run: |
          $exe = Resolve-Path 'dist/WARP 新开关/WARP 新开关.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshots', "$PWD\screenshots", '--out', "$PWD\screenshots.txt" -Wait -PassThru
          Get-Content screenshots.txt
          exit $p.ExitCode

      - name: Real WARP connection test
        id: connect
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $exe = Resolve-Path 'dist/WARP 新开关/WARP 新开关.exe'
          $data = Join-Path $env:RUNNER_TEMP 'warpdata'
          $p = Start-Process -FilePath $exe -ArgumentList '--connect-test', '--data', $data, '--out', "$PWD\connecttest.txt" -Wait -PassThru
          Get-Content connecttest.txt
          New-Item -ItemType Directory -Force connect-logs | Out-Null
          Get-ChildItem $data -Filter *.log | Copy-Item -Destination connect-logs
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: WARP-Switch-Next-Windows
          path: dist/*.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.connect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Select-String -Path build.ps1 -Pattern "^\$Version = '(.+)'").Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; nothing to publish."; exit 0 }
          $zip = "dist/WARP-Switch-Next-Windows-$version.zip"
          gh release create $tag $zip --target $env:GITHUB_SHA --title "WARP 新开关 Windows 版 $version" --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            selftest.txt
            proxytest.txt
            screenshots.txt
            connecttest.txt
            screenshots/
            connect-logs/
